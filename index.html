<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module">
      import { createButton } from './dist/es/index.js';
      import { createButton as createButtonDirect } from './dist/es/button/index.js';

      const root = document.getElementById('root');

      const button1 = createButton('index');
      const button2 = createButtonDirect('button/index');

      [button1, button2].forEach((element) => root.appendChild(element));
    </script>
  </body>
</html>
