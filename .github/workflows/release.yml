name: Release & Changelog

run-name: ${{ github.workflow }} ${{ inputs.tag }} from dev by ${{ github.actor }}

permissions:
  contents: 'write'

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, for example v1.0.0'
        required: true
        type: string

jobs:
  Build:
    uses: ./.github/workflows/build-and-tests.yml
    secrets: inherit

  Changelog:
    runs-on: 'ubuntu-latest'
    needs: ['Build']
    permissions:
      contents: 'write'
    steps:
      - name: 'Checkout dev'
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: 'Generate a changelog'
        uses: orhun/git-cliff-action@v4
        with:
          config: cliff.toml
          args: --verbose --tag ${{ inputs.tag }}
        env:
          OUTPUT: CHANGELOG.md
          GITHUB_REPO: ${{ github.repository }}

      - name: 'Commit changelog'
        # https://mintlify.wiki/orhun/git-cliff/integrations/github-actions#automated-changelog-updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add CHANGELOG.md

          if git diff --staged --quiet; then
            echo "No changelog changes"
          else
            git commit -m "docs: update CHANGELOG.md [skip ci]"
            git push origin HEAD:dev
          fi

  Release:
    runs-on: 'ubuntu-latest'
    needs: ['Changelog']
    permissions:
      contents: 'write'
    steps:
      - name: 'Checkout dev'
        uses: actions/checkout@v7
        with:
          ref: dev
          fetch-depth: 0

      - name: 'Create and push tag'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git tag -a "${{ inputs.tag }}" -m "Release ${{ inputs.tag }}"
          git push origin "${{ inputs.tag }}"

      - name: 'Create GitHub release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${{ inputs.tag }}" --generate-notes

  CleanupReleaseIfFailed:
    runs-on: 'ubuntu-latest'
    needs: ['Release']
    if: ${{ failure() && needs.Release.result == 'failure' }}
    permissions:
      contents: 'write'
    steps:
      - name: 'Delete the release after failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release delete "${{ inputs.tag }}" --yes --cleanup-tag=true
