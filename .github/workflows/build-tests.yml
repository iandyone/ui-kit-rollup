name: Build and tests
run-name: ${{ github.workflow }} on `${{ github.ref_name }}` by `${{ github.actor }}`

on:
  push:
    branches-ignore:
      - 'master'
  pull_request:
    branches:
      - 'master'
      - 'dev'
  workflow_dispatch:

jobs:
  Build:
    runs-on: ubuntu-latest

    steps:
      - name: 'Checkout'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 'Setup node'
        uses: actions/setup-node@v7
        with:
          node-version: '24.0.0'
          cache: 'npm'

      - name: 'Install deps'
        run: npm ci

      - name: 'Build'
        run: npm run build

      - name: 'Lint'
        run: npm run lint

      - name: 'virtual tests'
        run: |
          npx playwright install chromium
          npx playwright install --with-deps chromium
          npm run test

      - name: 'Run Chromatic'
        uses: chromaui/action@v13
        with:
          projectToken: ${{ secrets.CHROMATIC_PROJECT_TOKEN }}
          exitZeroOnChanges: false

      - name: 'Crete build artefact'
        uses: actions/upload-artifact@v7
        with:
          name: 'build'
          path: ./dist
          retention-days: 1

      - name: 'Crete coverage artefact'
        uses: actions/upload-artifact@v7
        with:
          name: 'coverage'
          path: ./coverage
          retention-days: 1
